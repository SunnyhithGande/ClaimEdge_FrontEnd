<nav class="navbar app-header">
 
    <div class="header-left d-flex align-items-center">
        <!-- Top Left Corner Hamburger Icon (Clean 3 Horizontal Bars) -->
        <button class="btn p-0 me-3 hamburger-btn border-0 bg-transparent text-white" (click)="toggleSidebar()" title="Toggle Navigation Sidebar">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
 
        <div class="brand">
            <i class="bi bi-shield-check brand-icon"></i>
            <div>
                <div class="brand-title">ClaimEdge</div>
                <div class="brand-subtitle">Insurance Suite</div>
            </div>
        </div>
    </div>
 
    <!--<div class="header-center">
        <div class="search-container">
            <i class="bi bi-search"></i>
            <input type="text" placeholder="Search claims, policies, users..." />
        </div>
    </div>-->
 
    <div class="header-right d-flex align-items-center gap-3">
 
        <!-- Bright Yellow Notification Bell Icon (Navigates to /notifications) -->
        <a *ngIf="userRole !== 'COMPLIANCE' && userRole !== 'FRAUD_ANALYST' && userRole !== 'POLICY_ADMIN' && userRole !== 'UNDERWRITER' && userRole !== 'ADJUSTER'" routerLink="/notifications" class="notification-area text-decoration-none position-relative d-flex align-items-center justify-content-center p-2 me-1" title="View Notifications">
            <!-- Bright Yellow Bell SVG Matching Image 1 -->
            <svg width="28" height="28" viewBox="0 0 24 24" fill="#fbbf24" stroke="#d97706" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="notification-badge">
                {{ unreadNotificationsCount }}
            </span>
        </a>
 
        <!-- Grey Profile Avatar Silhouette Image beside Name (Matching Image 2) -->
        <div class="user-profile-wrapper position-relative">
            <div class="user-info d-flex align-items-center gap-2 cursor-pointer p-1 rounded hover-bg-dark" (click)="toggleProfileMenu()" title="Click for Profile & Sign Out">
                <!-- Grey Avatar Silhouette SVG -->
                <div class="user-avatar-svg shadow-sm rounded-circle overflow-hidden d-flex align-items-center justify-content-center" style="width: 36px; height: 36px; background: #cbd5e1;">
                    <svg width="36" height="36" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="50" fill="#cbd5e1"/>
                        <circle cx="50" cy="40" r="22" fill="#64748b"/>
                        <path d="M 18 88 C 18 64, 82 64, 82 88 Z" fill="#64748b"/>
                    </svg>
                </div>
 
                <div class="text-start">
                    <div class="user-name fw-bold fs-7 text-white d-flex align-items-center gap-1">
                        {{ userName }} <i class="bi bi-chevron-down fs-9 text-white-50"></i>
                    </div>
                    <div class="user-role-badge">
                        {{ userRole }}
                    </div>
                </div>
            </div>
 
            <!-- Profile Dropdown Menu (Sign Out Option for Entire App) -->
            <div *ngIf="showProfileMenu" class="profile-dropdown-menu shadow-lg rounded-3 bg-white border position-absolute end-0 mt-2 py-2" style="width: 240px; z-index: 1050;">
                <div class="px-3 py-2 border-bottom text-dark">
                    <div class="d-flex align-items-center gap-2">
                        <div class="rounded-circle overflow-hidden" style="width: 38px; height: 38px; background: #cbd5e1;">
                            <svg width="38" height="38" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="50" fill="#cbd5e1"/>
                                <circle cx="50" cy="40" r="22" fill="#64748b"/>
                                <path d="M 18 88 C 18 64, 82 64, 82 88 Z" fill="#64748b"/>
                            </svg>
                        </div>
                        <div>
                            <div class="fw-bold fs-7 text-dark">{{ userName }}</div>
                            <small class="text-muted fs-8">{{ userRole }}</small>
                        </div>
                    </div>
                </div>
                <div class="py-1">
                    <a *ngIf="userRole !== 'COMPLIANCE' && userRole !== 'FRAUD_ANALYST' && userRole !== 'POLICY_ADMIN' && userRole !== 'UNDERWRITER' && userRole !== 'ADJUSTER'" routerLink="/notifications" class="dropdown-item text-dark d-flex align-items-center gap-2 py-2 px-3 fs-7 text-decoration-none" (click)="closeProfileMenu()">
                        <i class="bi bi-bell text-warning fs-6"></i> Notifications
                    </a>
                </div>
                <div class="border-top pt-1 mt-1">
                    <button class="dropdown-item text-danger d-flex align-items-center gap-2 py-2 px-3 fw-bold fs-7 w-100 text-start border-0 bg-transparent" (click)="signOut()">
                        <i class="bi bi-box-arrow-right fs-6"></i> Sign Out
                    </button>
                </div>
            </div>
        </div>
 
    </div>
 
</nav>
