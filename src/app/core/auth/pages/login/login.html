<div class="login-page">
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="bi bi-shield-check login-icon"></i>
            <h2 class="mt-3">ClaimEdge</h2>
            <p class="text-muted">Enterprise Insurance Management Portal</p>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger py-2 fs-7 mb-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ errorMessage }}
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="signIn()">
            <div class="mb-3">
                <label class="form-label font-weight-bold">Select Portal Role</label>
                <select class="form-select" formControlName="role">
                    <option *ngFor="let r of rolesList" [value]="r.value">
                        👤 {{ r.label }}
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label font-weight-bold">Email Address</label>
                <input type="email" class="form-control" formControlName="email" placeholder="name@company.com">
                <small class="text-danger" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
                    Valid email address is required
                </small>
            </div>

            <div class="mb-4">
                <label class="form-label font-weight-bold">Password</label>
                <input type="password" class="form-control" formControlName="password" placeholder="••••••••">
                <small class="text-danger" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
                    Password must be at least 6 characters
                </small>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 font-weight-bold" [disabled]="loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"></span>
                Sign In to Enterprise Portal
            </button>

            <div class="text-center mt-3">
                <a routerLink="/register" class="text-decoration-none">
                    New User? Register Account Here
                </a>
            </div>
        </form>
    </div>
</div>
