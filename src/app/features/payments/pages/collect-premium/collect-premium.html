<div class="container-fluid py-4">

    <div class="mb-4">

        <h2>Collect Premium</h2>

        <p class="text-muted">
            Record customer premium payments.
        </p>

    </div>

    <div class="card">

        <div class="card-header">

            Premium Payment Information

        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Policy ID
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        [(ngModel)]="paymentData.policyId">

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Amount
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        [(ngModel)]="paymentData.amount">

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Payment Method
                    </label>

                    <select
                        class="form-select"
                        [(ngModel)]="paymentData.paymentMethod">

                        <option value="">
                            Select Method
                        </option>

                        <option value="CARD">
                            Card
                        </option>

                        <option value="UPI">
                            UPI
                        </option>

                        <option value="BANK_TRANSFER">
                            Bank Transfer
                        </option>

                        <option value="CASH">
                            Cash
                        </option>

                    </select>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Payment Date
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        [(ngModel)]="paymentData.paymentDate">

                </div>

                <div class="col-12 mb-3">

                    <label class="form-label">
                        Notes
                    </label>

                    <textarea
                        rows="4"
                        class="form-control"
                        [(ngModel)]="paymentData.notes">
                    </textarea>

                </div>

            </div>

            <div class="button-group">

                <button
                    class="btn btn-secondary">

                    Cancel

                </button>

                <button
                    class="btn btn-primary"
                    (click)="collectPremium()">

                    Collect Payment

                </button>

            </div>

        </div>

    </div>

</div>
